# Infraestructura como código para Render.
# Render lee este archivo en cada deploy y aplica los cambios.
# Los SECRETOS no se commitean acá — se setean en el dashboard de Render
# (sync: false) y Render los mantiene fuera del repo.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------------
  # Web service — STAGING (rama: staging)
  # -------------------------------------------------------------------
  - type: web
    name: golosinas-insa-staging
    runtime: python
    region: oregon  # ajustá si Neon está en otra región
    # Staging queda en FREE para no pagar dos instancias. Consecuencia:
    # el dyno duerme tras 15 min de inactividad → qcluster TAMBIÉN se
    # duerme → schedules cron NO disparan en staging hasta que alguien
    # despierte el dyno con una request. Para staging es aceptable
    # (lo usamos para tests manuales del web; los crons de archivado
    # los probás en production).
    plan: free
    branch: staging
    autoDeploy: true
    rootDir: VentaStockManager
    buildCommand: |
      pip install -r ../requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
      python manage.py ensure_admin
    # honcho start ejecuta `web` y `worker` del Procfile como hijos del
    # mismo proceso. Si uno cae, los dos se reinician (Render relanza
    # el dyno). Reemplaza al servicio "type: worker" separado, que
    # costaría otros USD 7 por entorno.
    #
    # Usamos `python -m honcho` (no `honcho` directo) porque con
    # rootDir=VentaStockManager el cwd de runtime queda en el subdir
    # y el bin del venv (.../bin/honcho) NO siempre queda en PATH.
    # `python -m` evita depender del PATH: importa el módulo y ya.
    # El mismo razonamiento aplica a gunicorn dentro del Procfile.
    startCommand: python -m honcho start
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: golosinas-insa-staging.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://golosinas-insa-staging.onrender.com
      - key: GOOGLE_CREDENTIALS_PATH
        value: /etc/secrets/google-credentials.json
      # Sheet de staging (copia del de prod, para no tocar datos reales)
      - key: GOOGLE_SHEET_ID
        value: 1GiKCywO6-6ab_sfUgDXxxbPzvjNXmSYyZBLckh5vtDs
      - key: GOOGLE_SHEET_RANGE
        value: articulos!A1:Z1500
      # NOTA: los flags de sync con Google Sheets se controlan ahora
      # desde el singleton ConfiguracionGeneral (admin runtime). Ya
      # no se setean acá. Para apagar/prender: /admin/configuracion/.
      # Secretos — se setean en el dashboard, no en este archivo
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # pegar manualmente la de Neon staging
      # Bootstrap del superuser admin sin necesidad de Render Shell.
      # El management command `ensure_admin` (corre en buildCommand)
      # crea o actualiza el usuario "admin" con este password. Si la
      # var está vacía o sin definir, el command es no-op.
      # Para resetear el password: cambiás esta var y redeploy.
      # Opcionales: ADMIN_USERNAME (default "admin"), ADMIN_EMAIL.
      - key: ADMIN_PASSWORD
        sync: false

  # -------------------------------------------------------------------
  # Web service — PRODUCTION (rama: production)
  # -------------------------------------------------------------------
  # Convención de ramas durante la migración:
  #   - main        = snapshot del código que corre en PythonAnywhere (legacy)
  #   - staging     = lo que va a Render staging (deploy + tests)
  #   - production  = lo que va a Render production (deploy real al cliente)
  # Cuando jubilemos PythonAnywhere, main puede absorber a production.
  - type: web
    name: golosinas-insa
    runtime: python
    region: oregon
    # PRODUCTION en Starter (USD 7/mes). Necesario porque:
    #  1. Free duerme tras 15 min → qcluster muere → schedules cron
    #     (archivado de ventas, futuros envíos de WA) no corren.
    #  2. Starter mantiene el dyno siempre vivo + más RAM (512MB) para
    #     que gunicorn + qcluster compartan sin OOM.
    # Con esto evitamos pagar un servicio "type: worker" aparte
    # (que serían otros USD 7). honcho corre los dos procesos juntos.
    plan: starter
    branch: production
    autoDeploy: true
    rootDir: VentaStockManager
    buildCommand: |
      pip install -r ../requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
      python manage.py ensure_admin
    # honcho lee VentaStockManager/Procfile y levanta `web` (gunicorn)
    # + `worker` (qcluster) como hijos. Ver Procfile para detalles.
    # `python -m honcho` en vez de `honcho` por el problema de PATH
    # con rootDir (ver comentario equivalente en el servicio staging).
    startCommand: python -m honcho start
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: golosinas-insa.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://golosinas-insa.onrender.com
      - key: GOOGLE_CREDENTIALS_PATH
        value: /etc/secrets/google-credentials.json
      - key: GOOGLE_SHEET_ID
        value: 1Zv9TDVJRDG_Ar-U4qTvlTcTiJ7RUpZnawxGwPpL4IZI
      - key: GOOGLE_SHEET_RANGE
        value: articulos!A1:Z1500
      # NOTA: los flags de sync con Google Sheets se controlan ahora
      # desde el singleton ConfiguracionGeneral (admin runtime). Ya
      # no se setean acá. Para apagar/prender en production:
      # /admin/configuracion/configuraciongeneral/.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # pegar manualmente la de Neon production
      # Bootstrap del superuser admin sin Render Shell (que requiere
      # plan superior). El management command `ensure_admin` corre en
      # buildCommand y crea/actualiza el usuario "admin" usando esta
      # var. Idempotente: si rotás el password, redeploy y listo.
      # Opcionales: ADMIN_USERNAME (default "admin"), ADMIN_EMAIL.
      - key: ADMIN_PASSWORD
        sync: false
      # ---- WhatsApp (Baileys, servicio `wa-bot` definido más abajo) ----
      # Render expone los Private Services al resto del Blueprint por
      # NOMBRE — el DNS interno `wa-bot` resuelve al pserv. NO usar
      # https ni dominio público: el pserv no tiene URL externa.
      - key: WHATSAPP_API_URL
        value: http://wa-bot:3000
      # Token compartido entre Django ↔ wa-bot. Tiene que matchear con
      # `WA_BOT_TOKEN` del pserv (el bot usa el MISMO token tanto para
      # validar requests entrantes como para autenticar el webhook que
      # le manda a Django). Generar uno con
      # `python -c "import secrets; print(secrets.token_urlsafe(32))"`
      # y pegar el MISMO valor en los dos envVars desde el dashboard.
      - key: WHATSAPP_API_TOKEN
        sync: false

  # -------------------------------------------------------------------
  # wa-bot — Private Service (Baileys) — PRODUCTION
  # -------------------------------------------------------------------
  # Bot de WhatsApp escrito en Node (ver carpeta /wa-bot del repo).
  # Migrado de @open-wa/wa-automate (discontinuado, rompía en Apple
  # Silicon y dejó de inyectar WAPI) a @whiskeysockets/baileys, que
  # habla directo el protocolo Signal de WA por WebSocket — sin
  # Puppeteer, sin Chromium, mucho más liviano y estable.
  #
  # `type: pserv` = Private Service. NO expuesto a internet, solo
  # accesible desde otros servicios del mismo Blueprint vía el DNS
  # interno `http://wa-bot:3000`. Eso protege el endpoint del bot
  # (que de leakear permitiría mandar WA desde el número del cliente).
  #
  # Plan starter (USD 7/mes) porque pserv NO soporta plan free.
  # El disco persistente guarda el auth state de Baileys (creds.json
  # + keys/) — sin eso, cada redeploy te pediría escanear QR de nuevo.
  - type: pserv
    name: wa-bot
    runtime: docker
    region: oregon  # MISMA región que el web — si no, hops inter-AZ
    plan: starter
    branch: production
    autoDeploy: true
    rootDir: wa-bot
    dockerfilePath: ./Dockerfile
    envVars:
      - key: WA_BOT_PORT
        value: "3000"
      # Token compartido Django ↔ bot. Tiene que ser el MISMO valor que
      # WHATSAPP_API_TOKEN del servicio web. El bot lo usa para dos cosas:
      #   1. Validar el header `X-Bot-Token` en sus propios endpoints
      #      (Django → bot: enviar mensaje, exists, qr, etc.)
      #   2. Re-enviarlo como `X-Bot-Token` cuando llama al webhook de
      #      Django (bot → Django: mensaje entrante para auto-responder).
      # Generar con: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: WA_BOT_TOKEN
        sync: false
      # Base URL de Django para el webhook de mensajes entrantes. El bot
      # agrega `/wa-campania/api/incoming/` por su cuenta — pasarle SOLO
      # el origen. Es URL PÚBLICA (el bot llama desde fuera del Blueprint
      # hacia el web; los pserv pueden hacer egress a internet sin problema).
      - key: DJANGO_URL
        value: https://golosinas-insa.onrender.com
    disk:
      name: wa-bot-sessions
      mountPath: /sessions  # Baileys persiste creds + keys acá
      sizeGB: 1             # ~USD 0.25/mes — sobra para el auth state

# -------------------------------------------------------------------
