# Infraestructura como código para Render.
# Render lee este archivo en cada deploy y aplica los cambios.
# Los SECRETOS no se commitean acá — se setean en el dashboard de Render
# (sync: false) y Render los mantiene fuera del repo.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------------
  # Web service — STAGING (rama: staging)
  # -------------------------------------------------------------------
  - type: web
    name: golosinas-insa-staging
    runtime: python
    region: oregon  # ajustá si Neon está en otra región
    # Staging queda en FREE para no pagar dos instancias. Consecuencia:
    # el dyno duerme tras 15 min de inactividad → qcluster TAMBIÉN se
    # duerme → schedules cron NO disparan en staging hasta que alguien
    # despierte el dyno con una request. Para staging es aceptable
    # (lo usamos para tests manuales del web; los crons de archivado
    # los probás en production).
    plan: free
    branch: staging
    autoDeploy: true
    rootDir: VentaStockManager
    buildCommand: |
      pip install -r ../requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
    # honcho start ejecuta `web` y `worker` del Procfile como hijos del
    # mismo proceso. Si uno cae, los dos se reinician (Render relanza
    # el dyno). Reemplaza al servicio "type: worker" separado, que
    # costaría otros USD 7 por entorno.
    startCommand: honcho start
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: golosinas-insa-staging.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://golosinas-insa-staging.onrender.com
      - key: GOOGLE_CREDENTIALS_PATH
        value: /etc/secrets/google-credentials.json
      # Sheet de staging (copia del de prod, para no tocar datos reales)
      - key: GOOGLE_SHEET_ID
        value: 1GiKCywO6-6ab_sfUgDXxxbPzvjNXmSYyZBLckh5vtDs
      - key: GOOGLE_SHEET_RANGE
        value: articulos!A1:Z1500
      # NOTA: los flags de sync con Google Sheets se controlan ahora
      # desde el singleton ConfiguracionGeneral (admin runtime). Ya
      # no se setean acá. Para apagar/prender: /admin/configuracion/.
      # Secretos — se setean en el dashboard, no en este archivo
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # pegar manualmente la de Neon staging

  # -------------------------------------------------------------------
  # Web service — PRODUCTION (rama: production)
  # -------------------------------------------------------------------
  # Convención de ramas durante la migración:
  #   - main        = snapshot del código que corre en PythonAnywhere (legacy)
  #   - staging     = lo que va a Render staging (deploy + tests)
  #   - production  = lo que va a Render production (deploy real al cliente)
  # Cuando jubilemos PythonAnywhere, main puede absorber a production.
  - type: web
    name: golosinas-insa
    runtime: python
    region: oregon
    # PRODUCTION en Starter (USD 7/mes). Necesario porque:
    #  1. Free duerme tras 15 min → qcluster muere → schedules cron
    #     (archivado de ventas, futuros envíos de WA) no corren.
    #  2. Starter mantiene el dyno siempre vivo + más RAM (512MB) para
    #     que gunicorn + qcluster compartan sin OOM.
    # Con esto evitamos pagar un servicio "type: worker" aparte
    # (que serían otros USD 7). honcho corre los dos procesos juntos.
    plan: starter
    branch: production
    autoDeploy: true
    rootDir: VentaStockManager
    buildCommand: |
      pip install -r ../requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
    # honcho lee VentaStockManager/Procfile y levanta `web` (gunicorn)
    # + `worker` (qcluster) como hijos. Ver Procfile para detalles.
    startCommand: honcho start
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: golosinas-insa.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://golosinas-insa.onrender.com
      - key: GOOGLE_CREDENTIALS_PATH
        value: /etc/secrets/google-credentials.json
      - key: GOOGLE_SHEET_ID
        value: 1Zv9TDVJRDG_Ar-U4qTvlTcTiJ7RUpZnawxGwPpL4IZI
      - key: GOOGLE_SHEET_RANGE
        value: articulos!A1:Z1500
      # NOTA: los flags de sync con Google Sheets se controlan ahora
      # desde el singleton ConfiguracionGeneral (admin runtime). Ya
      # no se setean acá. Para apagar/prender en production:
      # /admin/configuracion/configuraciongeneral/.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # pegar manualmente la de Neon production

