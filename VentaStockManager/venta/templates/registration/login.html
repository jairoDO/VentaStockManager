<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de repartidores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 sm:p-8">
    <div class="mb-6">
      <p class="text-xs uppercase tracking-widest text-blue-600 font-semibold">Venta Stock</p>
      <h1 class="text-2xl font-bold mt-1">Acceso de repartidores</h1>
      <p class="text-sm text-slate-500 mt-2">Ingresá para ver las entregas que te asignaron.</p>
    </div>

    {% if form.errors %}
      <div class="mb-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800">
        Usuario o contraseña incorrectos.
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div>
        <label for="id_username" class="block text-sm font-medium mb-1">Usuario</label>
        <input id="id_username" name="username" type="text" autocomplete="username" autofocus required
               class="w-full rounded-lg border border-slate-300 px-3 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium mb-1">Contraseña</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 transition-colors">
        Ingresar a mis repartos
      </button>
    </form>

    <a href="/admin/login/" class="block text-center text-sm text-slate-500 underline mt-6">
      Acceso de administración
    </a>
  </main>
</body>
</html>
