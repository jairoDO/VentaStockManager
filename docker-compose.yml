# Stack local para desarrollo. NO se usa en Render.
#
# Uso:
#   docker compose up                  # arranca app + postgres
#   docker compose exec web bash       # entrar al container de Django
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py createsuperuser
#
# La app queda en http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ventastock
      POSTGRES_PASSWORD: ventastock_dev
      POSTGRES_DB: ventastock
    # Sin binding al host: web/qcluster hablan con db por la red interna
    # de Docker. Si necesitás conectarte con psql local descomentá esto
    # (usá 5434 si tenés otro Postgres en 5432).
    # ports:
    #   - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventastock"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Mismo formato que en Render — la app no sabe la diferencia
      DATABASE_URL: postgres://ventastock:ventastock_dev@db:5432/ventastock
      SECRET_KEY: dev-only-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://localhost:8000
      # Para probar el sync de Google Sheets localmente, montá tu
      # credentials.json como volumen (ver abajo) y apuntá acá:
      GOOGLE_CREDENTIALS_PATH: /run/secrets/google-credentials.json
      GOOGLE_SHEET_ID: 1GiKCywO6-6ab_sfUgDXxxbPzvjNXmSYyZBLckh5vtDs
      GOOGLE_SHEET_RANGE: articulos!A1:Z1500
      # URL del wa-bot dentro de la red de docker-compose. El
      # service `wa-bot` es resoluble por nombre (DNS interno).
      WHATSAPP_API_URL: http://wa-bot:3000
      # Token compartido con el wa-bot. En local lo dejamos vacío
      # (modo dev sin auth) — el wa-bot loguea un warning al
      # arrancar pero anda. En producción ambos lados tienen que
      # tener el MISMO valor.
      WHATSAPP_API_TOKEN: ""
    ports:
      # Host 8080 → container 8000. abs-stack ocupa 8000-8003,
      # así que vamos a 8080. App queda en http://localhost:8080
      - "8080:8000"
    volumes:
      # Montar el código actual — cambios se reflejan al instante
      - .:/app
      # Montar tus credenciales locales como Secret File (solo lectura)
      - ~/credentials-backup/golosinas-insa-credentials.json:/run/secrets/google-credentials.json:ro

  # Worker de django-q2. Procesa los Schedules (cron) y los
  # async_task() encolados (envíos de WhatsApp, archivado de ventas
  # antiguas, sync delete a Sheets). Sin esto los tasks quedan en
  # la cola y nadie los corre.
  #
  # Comparte la misma imagen que el web (mismo código, mismo
  # entorno). La separación es solo de proceso: el web sirve HTTP,
  # el qcluster mastica jobs.
  qcluster:
    build: .
    command: python manage.py qcluster
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tiene que ver la MISMA DB que el web — comparten cola.
      DATABASE_URL: postgres://ventastock:ventastock_dev@db:5432/ventastock
      SECRET_KEY: dev-only-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      # Si querés debuggear envíos de WhatsApp desde tasks, el
      # qcluster necesita poder hablarle al wa-bot.
      WHATSAPP_API_URL: http://wa-bot:3000
      WHATSAPP_API_TOKEN: ""
      # Las credenciales de Sheets se montan abajo, igual que en el web.
      GOOGLE_CREDENTIALS_PATH: /run/secrets/google-credentials.json
      GOOGLE_SHEET_ID: 1GiKCywO6-6ab_sfUgDXxxbPzvjNXmSYyZBLckh5vtDs
      GOOGLE_SHEET_RANGE: articulos!A1:Z1500
    volumes:
      - .:/app
      - ~/credentials-backup/golosinas-insa-credentials.json:/run/secrets/google-credentials.json:ro

  # Bridge Node.js para WhatsApp (open-wa). Levantarlo aparte con
  # `docker compose up wa-bot` ya que arrastra ~600MB de Chromium y
  # no siempre lo querés corriendo.
  wa-bot:
    build: ./wa-bot
    # unless-stopped: el container se reinicia automáticamente si el
    # proceso muere (típicamente por nuestro POST /logout o /restart,
    # que hacen process.exit(0) para forzar un arranque limpio de
    # Chromium). NO se reinicia si vos hacés `docker compose stop`.
    restart: unless-stopped
    environment:
      WA_BOT_PORT: "3000"
      WA_BOT_SESSION_DIR: /sessions
      WA_BOT_SESSION_ID: venta-stock-local
      # Empty = modo dev sin auth (anda igual, loguea un warning).
      # Cuando deployemos, esto debe coincidir con
      # `WHATSAPP_API_TOKEN` en el web service.
      WA_BOT_TOKEN: ""
    # Sin binding al host: el container web habla con wa-bot por la
    # red interna de Docker (http://wa-bot:3000). Si necesitás escanear
    # el QR localmente, descomentá esto (usá otro puerto si tenés algo
    # en 3000) o entrá con `docker compose exec wa-bot ...`.
    # ports:
    #   - "3001:3000"
    volumes:
      - wa_bot_sessions:/sessions

volumes:
  postgres_data:
  # Sesión persistente del wa-bot. Si se borra, hay que volver a
  # escanear el QR.
  wa_bot_sessions:
